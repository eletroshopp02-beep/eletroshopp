<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>Pagamento — Eletroshopp</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08090d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(560px,100%);background:#11131a;border:1px solid #252936;border-radius:24px;padding:34px;text-align:center;box-shadow:0 20px 60px #0008}
.logo{width:150px;max-width:60%;margin-bottom:24px}.icon{font-size:56px;margin:4px 0 16px}.ok{color:#69e39b}.wait{color:#ffd166}h1{margin:0 0 12px;font-size:28px}p{color:#b8bdc9;line-height:1.55;margin:10px 0}.order{margin:22px 0;padding:15px;border-radius:14px;background:#191c25;color:#fff;font-weight:700}.btn{display:inline-block;margin-top:12px;padding:14px 22px;border-radius:12px;background:#fff;color:#08090d;text-decoration:none;font-weight:800}.small{font-size:13px;color:#858b99}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="assets/logo.svg" alt="Eletroshopp">
<div id="icon" class="icon wait">⏳</div>
<h1 id="title">Pagamento recebido</h1>
<p id="text">Estamos confirmando seu pagamento. Aguarde alguns instantes; a confirmação será registrada automaticamente no seu pedido.</p>
<div id="order" class="order"></div>
<a id="receipt" class="btn" target="_blank" rel="noopener" hidden>Ver comprovante</a>
<br>
<a class="btn" href="/">Voltar para a Eletroshopp</a>
<p class="small">Você pode fechar esta página depois de guardar o comprovante.</p>
</main>
<script>
(async()=>{
 const q=new URLSearchParams(location.search);
 const order=q.get("order_nsu")||"";
 const transaction=q.get("transaction_nsu")||"";
 const slug=q.get("slug")||"";
 const receipt=q.get("receipt_url")||"";
 const el=id=>document.getElementById(id);
 el("order").textContent=order?"Pedido: "+order:"Pedido Eletroshopp";
 el("title").textContent="Verificando pagamento";
 el("text").textContent="Estamos consultando a confirmação diretamente na InfinitePay. Não feche esta página até terminar a verificação.";
 if(!order||!transaction||!slug){
   el("title").textContent="Pagamento em verificação";
   el("text").textContent="Ainda não recebemos todos os dados necessários para confirmar o pagamento. Aguarde alguns instantes e consulte o status do pedido.";
   return;
 }
 try{
   const response=await fetch("https://sybxbyaywznbwipbssso.supabase.co/functions/v1/infinitepay-verify-payment",{
     method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({order_nsu:order,transaction_nsu:transaction,slug,receipt_url:receipt})
   });
   const data=await response.json().catch(()=>({}));
   if(response.ok&&data.paid===true){
     el("icon").textContent="✓";el("icon").className="icon ok";
     el("title").textContent="Pagamento confirmado!";
     el("text").textContent="A InfinitePay confirmou o pagamento. Seu pedido foi atualizado com sucesso.";
     if(receipt){try{const u=new URL(receipt);if(u.protocol==="https:"){el("receipt").href=u.href;el("receipt").hidden=false}}catch{}}
   }else{
     el("icon").textContent="⏳";el("icon").className="icon wait";
     el("title").textContent="Pagamento ainda não confirmado";
     el("text").textContent="A InfinitePay ainda não confirmou este pagamento. Isso pode levar alguns instantes. Não faça um novo pagamento antes de verificar o status.";
   }
 }catch{
   el("title").textContent="Não foi possível verificar agora";
   el("text").textContent="Não conseguimos consultar a InfinitePay neste momento. O sistema continuará aguardando a confirmação automática.";
 }
})();
</script>
</body>
</html>
