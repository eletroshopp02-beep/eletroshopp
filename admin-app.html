<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090e"><meta name="description" content="Eletroshopp — aplicativo administrativo"><link rel="manifest" href="admin-manifest.json"><link rel="stylesheet" href="admin.css?v=20261004-10"><title>Eletroshopp Admin</title></head><body><header class="topbar"><div><strong>ELETROSHOPP</strong><span>Aplicativo administrativo</span></div><a href="./">← Loja</a></header><main><section id="login" class="panel login"><h1>Acesso administrativo</h1><p>Digite o PIN de administrador para consultar e gerenciar os pedidos.</p><div class="row"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="PIN administrativo"><button id="enter" class="primary">Entrar</button></div><div id="loginMsg" class="msg"></div></section><section id="app" hidden><div class="toolbar"><div><h1>Pedidos</h1><p id="summary">Carregando...</p></div><div class="actions"><button id="refresh">↻ Atualizar</button><button id="settingsBtn">⚙ Remetente</button></div></div><div id="settings" class="panel settings" hidden><h2>Dados do remetente</h2><div class="grid2"><label>Loja<input id="senderName" value="Eletroshopp"></label><label>CEP<input id="senderCep" value="84261-000"></label><label class="wide">Endereço<input id="senderAddress" placeholder="Rua, número, bairro, complemento"></label><label>Cidade/UF<input id="senderCity" placeholder="Cidade - PR"></label></div><button id="saveSettings" class="primary">Salvar</button></div><div id="orders" class="orders"></div></section></main><div id="toast" class="toast"></div><script src="admin.js?v=20261004-10"></script></body></html>
