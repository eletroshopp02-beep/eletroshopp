name: Extract catalog

on:
  push:
    branches: [catalog-extract]
permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract product array
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path("index.html").read_text(encoding="utf-8",errors="ignore")
          marker="let products=["
          start=s.find(marker)
          if start<0:
            raise SystemExit("Declaração let products=[ não encontrada")
          start+=len("let products=")
          depth=0
          quote=None
          esc=False
          end=None
          for i,ch in enumerate(s[start:],start):
            if quote:
              if esc:
                esc=False
              elif ch=="\\": 
                esc=True
              elif ch==quote:
                quote=None
              continue
            if ch in ('"',"'"):
              quote=ch
            elif ch=="[":
              depth+=1
            elif ch=="]":
              depth-=1
              if depth==0:
                end=i
                break
          if end is None:
            raise SystemExit("Fim do array products não encontrado")
          raw=s[start:end+1]
          try:
            data=json.loads(raw)
          except Exception:
            raw2=re.sub(r',\\s*([}\\]])',r'\\1',raw)
            data=json.loads(raw2)
          if not isinstance(data,list) or not data:
            raise SystemExit("Array de produtos vazio ou inválido")
          # Normaliza somente a estrutura; mantém imagens e dados existentes.
          out=[]
          for p in data:
            if isinstance(p,dict):
              out.append(p)
          Path("products-extracted.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PRODUTOS_EXTRAIDOS",len(out))
          print("PRIMEIRO",out[0].get("code"),out[0].get("name"),out[0].get("sale"))
          print("ULTIMO",out[-1].get("code"),out[-1].get("name"),out[-1].get("sale"))
          PY

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-debug.json products-extracted.json
          git commit -m "Gerar diagnóstico do catálogo legado" || exit 0
          git push --force

      - name: Transfer catalog to new project branch
        run: |
          cp products-extracted.json /tmp/products-extracted.json
          git fetch origin eletroshopp-novo
          git switch --detach origin/eletroshopp-novo
          mkdir -p data
          cp /tmp/products-extracted.json data/products.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git commit -m "Migrar catálogo completo para novo Eletroshopp" || exit 0
          git push origin HEAD:eletroshopp-novo
