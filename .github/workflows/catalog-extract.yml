name: Extract catalog

on:
  push:
    branches: [catalog-extract]
permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyze legacy catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          s=Path("index.html").read_text(encoding="utf-8",errors="ignore")
          report={"bytes":len(s.encode("utf-8")),"assignment_snippets":[],"code_samples":[]}
          tokens=["const products","let products","var products","products =","products=","produtos =","produtos="]
          seen=set()
          for token in tokens:
            start=0
            while True:
              pos=s.lower().find(token.lower(),start)
              if pos<0: break
              key=(token,pos)
              if key not in seen:
                report["assignment_snippets"].append({"token":token,"position":pos,"text":s[max(0,pos-300):pos+3000]})
                seen.add(key)
              start=pos+len(token)
              if len(report["assignment_snippets"])>=80: break
            if len(report["assignment_snippets"])>=80: break
          for m in re.finditer(r'["\\\']?code["\\\']?\\s*[:=]\\s*["\\\']([^"\\\']+)["\\\']',s,re.I):
            pos=m.start()
            report["code_samples"].append({"code":m.group(1),"position":pos,"text":s[max(0,pos-250):pos+1200]})
            if len(report["code_samples"])>=120: break
          Path("catalog-debug.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("assignments",len(report["assignment_snippets"]),"codes",len(report["code_samples"]))
          PY

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-debug.json
          git commit -m "Gerar diagnóstico do catálogo legado" || exit 0
          git push --force
