name: Extract catalog

on:
  push:
    branches: [catalog-extract]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8",errors="ignore")
          Path("catalog-size.txt").write_text(str(len(s.encode("utf-8"))))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-size.txt
          git commit -m "Extract catalog diagnostic" || exit 0
          git push
