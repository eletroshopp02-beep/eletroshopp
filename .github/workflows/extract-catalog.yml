name: Preparar catálogo Eletroshopp

on:
  push:
    branches: [eletroshopp-novo]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Analisar catálogo antigo
        run: python3 scripts/analyze_catalog.py

      - name: Gravar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add novo/data/extraction-report.txt
          git diff --cached --quiet || git commit -m "Diagnosticar catálogo legado"
          git push
