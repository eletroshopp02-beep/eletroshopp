name: Monitorar domínio e publicação da Eletroshopp

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar HTTPS
        id: https
        continue-on-error: true
        run: |
          set -e
          for host in eletroshopp.com.br www.eletroshopp.com.br; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 25 "https://$host/")
            echo "$host HTTP $code"
            test "$code" -ge 200 -a "$code" -lt 400
          done

      - name: Verificar se DNS resolve
        id: dns
        continue-on-error: true
        run: |
          set -e
          for host in eletroshopp.com.br www.eletroshopp.com.br; do
            records=$(dig +short "$host" A; dig +short "$host" AAAA; dig +short "$host" CNAME)
            echo "$host DNS: $records"
            test -n "$records"
          done

      - name: Abrir alerta se houver falha
        if: steps.https.outcome == 'failure' || steps.dns.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'ALERTA: domínio ou publicação da Eletroshopp';
            const body = 'O monitoramento detectou falha em HTTPS ou resolução DNS. Consulte a execução: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const issues = await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            if (!issues.data.some(i => i.title === title)) {
              await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
            }
