name: Validar novo Eletroshopp
on:
  push:
    branches: [eletroshopp-novo]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check services/freight.js
          node --check services/orders.js
      - name: Validar catálogo
        run: |
          test -s data/products.js
          grep -q "export const products" data/products.js
      - name: Validar HTML
        run: |
          grep -q 'src="./app.js"' index.html
          grep -q 'href="./styles.css"' index.html
          grep -q 'src="./supabase-config.js"' index.html
          grep -q 'id="checkoutModal"' index.html
