<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090e"><link rel="manifest" href="manifest.json?v=2"><title>Eletroshopp Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#07090e;color:#f5f6f8;font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.top{padding:18px 20px;background:#0c101a;border-bottom:1px solid #293246;display:flex;justify-content:space-between;align-items:center}.top strong{font-size:22px}.top span{display:block;color:#9da6b8;font-size:13px}.top a{color:#fff;text-decoration:none}main{max-width:1000px;margin:auto;padding:22px 16px}.box,.order{background:#111722;border:1px solid #293246;border-radius:18px;padding:22px}.login{max-width:560px;margin:9vh auto}.login h1{margin:8px 0}.login p{color:#b4bdcc}.pin{width:100%;padding:16px;border-radius:12px;border:1px solid #3a455b;background:#080c14;color:#fff;font-size:24px;letter-spacing:5px}.btn{padding:13px 16px;border:0;border-radius:12px;background:#ec174c;color:#fff;font-weight:700}.full{width:100%;margin-top:10px}.msg{color:#ff91aa;margin-top:10px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.bar h1{margin:0}.bar p{margin:4px 0;color:#9da6b8}.orders{display:grid;gap:14px}.head{display:flex;justify-content:space-between;gap:10px}.badge{background:#293246;border-radius:999px;padding:6px 10px;font-size:12px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.meta div{background:#0b1019;padding:11px;border-radius:10px}.meta small{display:block;color:#8e98aa;margin-bottom:4px}.item{display:flex;justify-content:space-between;border-top:1px solid #252d3b;padding:9px 0}.total{display:flex;justify-content:flex-end;gap:18px;flex-wrap:wrap;margin-top:12px}.select{padding:10px;border-radius:10px;background:#161d2a;color:#fff;border:1px solid #3a455b}.err{color:#ff91aa}@media(max-width:650px){.meta{grid-template-columns:1fr}.bar{align-items:flex-start}.total{justify-content:flex-start}}
</style></head><body><header class="top"><div><strong>ELETROSHOPP</strong><span>Aplicativo administrativo</span></div><a href="../">Loja</a></header><main>
<section id="login" class="box login"><div style="font-size:38px">⚡</div><h1>Acesso administrativo</h1><p>Digite seu PIN para consultar os pedidos.</p><input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="PIN"><button id="enter" class="btn full">Entrar</button><div id="msg" class="msg"></div></section>
<section id="app" hidden><div class="bar"><div><h1>Pedidos</h1><p id="summary">Consultando...</p></div><div><button id="refresh" class="btn">↻ Atualizar</button><button id="logout" class="btn" style="background:#293246">Sair</button></div></div><div id="orders" class="orders"></div></section>
</main><script>
(()=>{const API="https://sybxbyaywznbwipbssso.supabase.co/functions/v1/admin-orders";let pin="",orders=[];const $=s=>document.querySelector(s),money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function api(method="GET",body){const r=await fetch(API+"?t="+Date.now(),{method,cache:"no-store",headers:{"Content-Type":"application/json","x-admin-pin":pin},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Painel indisponível");return d}function render(a){orders=Array.isArray(a)?a:[];$("#summary").textContent=orders.length+" pedido(s)";$("#orders").innerHTML=orders.length?orders.map(o=>{const b=o.buyer||{},f=o.freight||{},it=Array.isArray(o.items)?o.items:[];return '<article class="order"><div class="head"><div><b>'+esc(o.id)+'</b><small>'+esc(o.created_at?new Date(o.created_at).toLocaleString("pt-BR"):"")+'</small></div><span class="badge">'+esc(o.status||"novo")+'</span></div><div class="meta"><div><small>Cliente</small>'+esc(b.name||"—")+'</div><div><small>WhatsApp</small>'+esc(b.phone||"—")+'</div><div><small>CEP</small>'+esc(b.cep||"—")+'</div></div><div><small>Endereço</small><p>'+esc(b.address||"—")+'</p></div>'+it.map(x=>'<div class="item"><span>'+esc((x.quantity||1)+"× "+x.name)+'</span><b>'+money((x.price||0)*(x.quantity||1))+'</b></div>').join("")+'<div class="total"><span>Produtos '+money(o.total_products)+'</span><span>Frete '+money(f.price)+'</span><b>Total '+money(o.grand_total)+'</b><select class="select" data-status="'+esc(o.id)+'"><option value="novo" '+(o.status==="novo"?"selected":"")+'>Novo</option><option value="em_separacao" '+(o.status==="em_separacao"?"selected":"")+'>Em separação</option><option value="enviado" '+(o.status==="enviado"?"selected":"")+'>Enviado</option><option value="entregue" '+(o.status==="entregue"?"selected":"")+'>Entregue</option><option value="cancelado" '+(o.status==="cancelado"?"selected":"")+'>Cancelado</option></select></div></article>'}).join(""):'<div class="box">Nenhum pedido encontrado.</div>'}async function load(){try{render(await api());$("#msg").textContent=""}catch(e){$("#summary").textContent="Erro ao consultar pedidos";$("#msg").textContent=e.message}}function logout(){pin="";sessionStorage.removeItem("esh-admin-pin");$("#app").hidden=true;$("#login").hidden=false;$("#pin").value=""}$("#enter").onclick=async()=>{pin=$("#pin").value.replace(/\D/g,"");if(pin!=="250808"){ $("#msg").textContent="PIN inválido.";return }sessionStorage.setItem("esh-admin-pin",pin);$("#login").hidden=true;$("#app").hidden=false;await load()};$("#pin").onkeydown=e=>{if(e.key==="Enter")$("#enter").click()};$("#refresh").onclick=load;$("#logout").onclick=logout;document.addEventListener("change",async e=>{const id=e.target.dataset.status;if(id)try{await api("POST",{id,status:e.target.value});await load()}catch(x){$("#msg").textContent=x.message}});const s=sessionStorage.getItem("esh-admin-pin");if(s==="250808"){pin=s;$("#login").hidden=true;$("#app").hidden=false;load()}})();
</script></body></html>
