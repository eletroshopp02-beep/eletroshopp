<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090e"><title>Eletroshopp — Administração</title><style>*{box-sizing:border-box}body{margin:0;background:#07090e;color:#f5f6fa;font:16px system-ui,sans-serif}.top{padding:18px 20px;background:#0c101a;border-bottom:1px solid #293246;display:flex;justify-content:space-between;align-items:center}.top strong{font-size:22px}.top a{color:#fff;text-decoration:none}main{max-width:1000px;margin:auto;padding:24px 16px}.panel,.order{background:#111722;border:1px solid #293246;border-radius:20px;padding:22px}.login{max-width:560px;margin:9vh auto}.login h1{font-size:30px}.login input{width:100%;padding:17px;border-radius:14px;border:1px solid #3a465e;background:#080c14;color:#fff;font-size:22px;letter-spacing:6px}.btn{padding:13px 16px;border:0;border-radius:12px;background:#ed174c;color:#fff;font-weight:700}.login .btn{width:100%;margin-top:12px}.msg{color:#ff8ba7;margin-top:12px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.orders{display:grid;gap:14px}.order-head,.totals,.actions{display:flex;justify-content:space-between;gap:10px;align-items:center}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.meta div{background:#0a0f18;padding:12px;border-radius:12px}.small{color:#9ba5b6;font-size:13px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #293246;padding:9px 0}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.order-actions button,.order-actions select{padding:10px 12px;border:1px solid #37445c;border-radius:10px;background:#171f2d;color:#fff}@media(max-width:650px){.meta{grid-template-columns:1fr}.toolbar{align-items:flex-start}.totals{flex-wrap:wrap;justify-content:flex-start}}</style></head><body><header class="top"><strong>ELETROSHOPP — ADMIN</strong><a href="./">← Loja</a></header><main><section id="login" class="panel login"><h1>Acesso administrativo</h1><p>Digite seu PIN de 6 dígitos.</p><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="PIN administrativo"><button id="enter" class="btn">Entrar</button><div id="msg" class="msg"></div></section><section id="app" hidden><div class="toolbar"><div><h1>Pedidos</h1><div id="summary" class="small"></div></div><div class="actions"><button id="refresh" class="order-actions button">↻ Atualizar</button><button id="logout" class="order-actions button">Sair</button></div></div><div id="orders" class="orders"></div></section></main><script>
(()=>{const API="https://sybxbyaywznbwipbssso.supabase.co/functions/v1/admin-orders";let pin=sessionStorage.getItem("eletro-admin-pin")||"",orders=[];const $=s=>document.querySelector(s),money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function api(method="GET",body){const r=await fetch(API,{method,headers:{"Content-Type":"application/json","x-admin-pin":pin},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Painel indisponível");return d}function render(a){$("#summary").textContent=a.length+" pedido(s)";$("#orders").innerHTML=a.length?a.map(o=>{const b=o.buyer||{},f=o.freight||{},it=Array.isArray(o.items)?o.items:[];return '<article class="order"><div class="order-head"><b>'+esc(o.id)+'</b><span>'+esc(o.status||"novo")+'</span></div><div class="small">'+esc(o.created_at?new Date(o.created_at).toLocaleString("pt-BR"):"")+'</div><p><b>Cliente:</b> '+esc(b.name)+'<br><b>WhatsApp:</b> '+esc(b.phone)+'<br><b>CEP:</b> '+esc(b.cep)+'<br>'+esc(b.address)+'</p>'+it.map(x=>'<div class="item"><span>'+esc((x.quantity||1)+"× "+x.name)+'</span><b>'+money((x.price||0)*(x.quantity||1))+'</b></div>').join("")+'<div class="totals"><span>Produtos '+money(o.total_products)+'</span><span>Frete '+money(f.price)+'</span><b>Total '+money(o.grand_total)+'</b></div><div class="order-actions"><select data-status="'+esc(o.id)+'"><option value="novo">Novo</option><option value="em_separacao">Em separação</option><option value="enviado">Enviado</option><option value="entregue">Entregue</option><option value="cancelado">Cancelado</option></select><button data-print="'+esc(o.id)+'">🖨 Pedido</button><button data-label="'+esc(o.id)+'">🏷 Etiqueta</button></div></article>'}).join(""):'<div class="panel">Nenhum pedido encontrado.</div>'}async function load(){try{const d=await api();orders=Array.isArray(d)?d:[];render(orders)}catch(e){$("#msg").textContent=e.message==="UNAUTHORIZED"?"PIN inválido.":"Painel indisponível: "+e.message;logout()}}function logout(){sessionStorage.removeItem("eletro-admin-pin");pin="";$("#app").hidden=true;$("#login").hidden=false}async function login(){pin=$("#pin").value.trim();if(!/^\d{6}$/.test(pin)){ $("#msg").textContent="Digite 6 números.";return }try{const d=await api();sessionStorage.setItem("eletro-admin-pin",pin);$("#login").hidden=true;$("#app").hidden=false;orders=Array.isArray(d)?d:[];render(orders);$("#msg").textContent=""}catch(e){$("#msg").textContent=e.message==="UNAUTHORIZED"?"PIN inválido.":"Painel indisponível: "+e.message}}$("#enter").onclick=login;$("#pin").onkeydown=e=>{if(e.key==="Enter")login()};$("#refresh").onclick=load;$("#logout").onclick=logout;document.addEventListener("change",async e=>{if(e.target.dataset.status){try{await api("POST",{id:e.target.dataset.status,status:e.target.value});load()}catch(x){alert(x.message)}}});function print(o,label){const b=o.buyer||{},f=o.freight||{},it=Array.isArray(o.items)?o.items:[];const c=it.map(x=>'<p>'+esc((x.quantity||1)+"× "+x.name)+' — '+money((x.price||0)*(x.quantity||1))+'</p>').join("");const h=label?'<h1>ELETROSHOPP</h1><h2>ETIQUETA DE ENVIO</h2><hr><b>DESTINATÁRIO</b><p>'+esc(b.name)+'<br>'+esc(b.address)+'<br>CEP: '+esc(b.cep)+'<br>Tel.: '+esc(b.phone)+'</p><hr><b>CONTEÚDO</b>'+c+'<p>Frete: '+money(f.price)+'<br><b>Total: '+money(o.grand_total)+'</b></p>':'<h1>ELETROSHOPP — PEDIDO</h1><p>Pedido: '+esc(o.id)+'<br>Data: '+esc(new Date(o.created_at).toLocaleString("pt-BR"))+'</p><h2>Cliente</h2><p>'+esc(b.name)+'<br>'+esc(b.phone)+'<br>'+esc(b.address)+'<br>CEP: '+esc(b.cep)+'</p><h2>Produtos</h2>'+c+'<hr><p>Produtos: '+money(o.total_products)+'<br>Frete: '+money(f.price)+'<br><b>Total: '+money(o.grand_total)+'</b></p>';const w=open("","_blank");w.document.write('<html><body style="font:14px Arial;margin:20px">'+h+'</body></html>');w.document.close();setTimeout(()=>w.print(),300)}document.addEventListener("click",e=>{const id=e.target.dataset.print||e.target.dataset.label;if(id){const o=orders.find(x=>x.id===id);if(o)print(o,!!e.target.dataset.label)}});if(pin){$("#login").hidden=true;$("#app").hidden=false;load()}})();
</script></body></html>
