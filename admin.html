<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2196f3"><title>Eletroshopp • Gestão de pedidos</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Inter,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.logo{font-size:27px;font-weight:900;color:#2196f3}.logo span{color:#fff}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer;background:#2196f3;color:#061018}.btn.alt{background:#1b1b1d;color:#fff;border:1px solid #444}.panel{background:#111;border:1px solid #292929;border-radius:18px;padding:18px;margin-bottom:16px}.login{max-width:430px;margin:8vh auto}.input{width:100%;padding:13px;margin:6px 0 10px;background:#19191b;color:#fff;border:1px solid #3a3a3a;border-radius:10px}.muted{color:#999;font-size:13px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#181818;border:1px solid #292929;border-radius:12px;padding:14px}.stat b{display:block;color:#2196f3;font-size:22px;margin-top:4px}.order{background:#171717;border:1px solid #333;border-radius:16px;padding:16px;margin:10px 0}.order.new{border-color:#2196f3}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.id{font-weight:900;color:#2196f3}.status{border-radius:999px;padding:5px 9px;background:#2196f3;color:#061018;font-size:11px;font-weight:900}.status.done{background:#333;color:#fff}.meta{color:#ccc;line-height:1.55;font-size:13px;margin-top:12px}.items{margin:10px 0;padding-left:20px;color:#ddd}.total{font-size:18px;font-weight:900;color:#2196f3;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}@media(max-width:650px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
@media print{body{background:#fff;color:#111}.no-print{display:none!important}.order{break-inside:avoid;border:1px solid #999;color:#111;background:#fff}.meta,.items{color:#111}.logo{color:#111}.status{color:#111;background:#ddd}.total,.id{color:#111}}
</style></head><body><main class="wrap">
<div id="login" class="panel login"><div class="logo">Eletro<span>shopp</span></div><h2>Área de gerenciamento</h2><p class="muted">Entre com a conta do proprietário cadastrada no Supabase.</p><input id="email" class="input" type="email" placeholder="E-mail"><input id="password" class="input" type="password" placeholder="Senha"><button id="loginBtn" class="btn" style="width:100%">Entrar</button><p id="loginMsg" class="muted"></p></div>
<section id="app" class="hidden"><div class="top"><div><div class="logo">Eletro<span>shopp</span></div><div class="muted">Pedidos • impressão • expedição</div></div><div class="actions no-print"><button id="refresh" class="btn alt">Atualizar</button><button id="printAll" class="btn">🖨️ Imprimir lista</button><button id="logout" class="btn alt">Sair</button></div></div>
<div class="stats"><div class="stat">Total de pedidos<b id="total">0</b></div><div class="stat">Novos<b id="new">0</b></div><div class="stat">Valor total<b id="value">R$ 0,00</b></div></div>
<div class="panel" style="margin-top:16px"><h2>Pedidos recebidos</h2><div id="list"><p class="muted">Carregando...</p></div></div></section></main>
<script>
const URL='https://sybxbyaywznbwipbssso.supabase.co',KEY='sb_publishable_3iXGUzzTaypiGou7K7UFEw_OW1qKljR';let token=null,orders=[];
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function auth(email,password){const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'Login não autorizado');return d.access_token}
async function load(){const r=await fetch(URL+'/rest/v1/orders?select=*&order=created_at.desc',{headers:{apikey:KEY,Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.message||d.details||'Não foi possível carregar os pedidos');orders=d||[];render()}
function render(){const list=document.getElementById('list');document.getElementById('total').textContent=orders.length;document.getElementById('new').textContent=orders.filter(o=>o.status==='novo').length;document.getElementById('value').textContent=money(orders.reduce((s,o)=>s+Number(o.grand_total||0),0));if(!orders.length){list.innerHTML='<p class="muted">Nenhum pedido recebido ainda.</p>';return}list.innerHTML=orders.map(o=>{const b=o.buyer||{},f=o.freight||{},items=o.items||[];const dt=new Date(o.created_at).toLocaleString('pt-BR');return '<article class="order '+(o.status==='novo'?'new':'')+'"><div class="head"><div><div class="id">'+esc(o.id)+'</div><div class="muted">'+dt+'</div></div><span class="status '+(o.status==='impresso'?'done':'')+'">'+esc(o.status||'novo').toUpperCase()+'</span></div><div class="meta"><b>Cliente:</b> '+esc(b.name||'—')+' • '+esc(b.phone||'—')+'<br><b>Endereço:</b> '+esc(b.address||'—')+', '+esc(b.number||'—')+' — '+esc(b.neighborhood||'—')+' — '+esc(b.city||'—')+' • CEP '+esc(b.cep||'—')+'<br><b>Frete:</b> '+esc(f.id||'—')+' • '+money(f.price)+' • '+esc(f.days||'—')+'<br><b>Pagamento:</b> '+esc(o.payment||'—')+'</div><ul class="items">'+items.map(i=>'<li>'+esc(i.qty||1)+'x '+esc(i.name||'')+' — '+esc(i.sale||'')+'</li>').join('')+'</ul><div class="total">Total: '+money(o.grand_total)+'</div><div class="actions no-print"><button class="btn" onclick="printOne(\''+encodeURIComponent(o.id)+'\')">🖨️ Imprimir pedido</button><button class="btn alt" onclick="markPrinted(\''+encodeURIComponent(o.id)+'\')">Marcar como impresso</button></div></article>'}).join('')}
function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function printOne(id){const o=orders.find(x=>x.id===decodeURIComponent(id));if(!o)return;const b=o.buyer||{},f=o.freight||{};const html='<html><head><title>'+o.id+'</title><style>body{font-family:Arial;padding:25px}h1{color:#111}.box{border:1px solid #999;border-radius:10px;padding:14px;margin:10px 0}.total{font-size:20px;font-weight:bold}</style></head><body><h1>Eletroshopp — Pedido '+esc(o.id)+'</h1><div class="box"><b>Cliente:</b> '+esc(b.name)+'<br><b>Telefone:</b> '+esc(b.phone)+'<br><b>Endereço:</b> '+esc(b.address)+', '+esc(b.number)+' — '+esc(b.neighborhood)+' — '+esc(b.city)+' — CEP '+esc(b.cep)+'</div><div class="box"><b>Itens</b><ul>'+((o.items||[]).map(i=>'<li>'+esc(i.qty||1)+'x '+esc(i.name)+' — '+esc(i.sale)+'</li>').join(''))+'</ul></div><div class="box"><b>Frete:</b> '+esc(f.id)+' — '+money(f.price)+' — '+esc(f.days)+'<br><b>Pagamento:</b> '+esc(o.payment)+'</div><div class="total">Total: '+money(o.grand_total)+'</div></body></html>';const w=window.open('','_blank');if(!w){alert('Permita pop-ups para imprimir o pedido.');return}w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),250);markPrinted(id)}
async function markPrinted(id){const real=decodeURIComponent(id);const r=await fetch(URL+'/rest/v1/orders?id=eq.'+encodeURIComponent(real),{method:'PATCH',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({status:'impresso'})});if(!r.ok){const d=await r.text();alert('Não foi possível atualizar o status. '+d);return}const o=orders.find(x=>x.id===real);if(o)o.status='impresso';render()}
document.getElementById('loginBtn').onclick=async()=>{const m=document.getElementById('loginMsg');m.textContent='Entrando...';try{token=await auth(document.getElementById('email').value.trim(),document.getElementById('password').value);sessionStorage.setItem('eletro_admin_token',token);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await load()}catch(e){m.textContent='Erro: '+e.message}};
document.getElementById('refresh').onclick=()=>load().catch(e=>alert(e.message));document.getElementById('printAll').onclick=()=>window.print();document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('eletro_admin_token');token=null;location.reload()};
(async()=>{token=sessionStorage.getItem('eletro_admin_token');if(token){try{document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await load()}catch(e){sessionStorage.removeItem('eletro_admin_token');token=null}}})();
</script></body></html>
