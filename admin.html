<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eletroshopp — Gestão de Pedidos</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#eee;font-family:Arial,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.head{position:sticky;top:0;background:#0b0b0bf5;border-bottom:1px solid #252525;backdrop-filter:blur(10px);z-index:5}.headin{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:28px;font-weight:950;color:#2196ff}.logo span{color:#fff}.btn{border:1px solid #333;background:#151515;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:#2196ff;color:#00101f;border-color:#2196ff}.btn.danger{background:#301010;border-color:#702020}.login{max-width:420px;margin:80px auto;background:#111;border:1px solid #303030;border-radius:18px;padding:24px}.login h1{margin-top:0}.input{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#090909;color:#fff;font-size:16px;margin:8px 0 14px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#111;border:1px solid #292929;border-radius:14px;padding:15px}.stat b{display:block;font-size:24px;color:#ffd400;margin-top:5px}.orders{display:grid;gap:12px}.order{background:#101010;border:1px solid #2b2b2b;border-radius:16px;padding:16px}.order.new{border-color:#2196ff;box-shadow:0 0 0 1px #2196ff22}.top{display:flex;justify-content:space-between;gap:10px}.id{font-weight:950;color:#ffd400}.status{font-size:11px;border-radius:999px;padding:5px 8px;background:#18361f;color:#7dff9b;font-weight:900}.status.printed{background:#333;color:#aaa}.meta{line-height:1.65;color:#ccc;margin:12px 0}.items{padding:10px;border-radius:10px;background:#080808;color:#ddd}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:40px;text-align:center;border:1px dashed #333;border-radius:15px;color:#888}.note{color:#888;font-size:12px}.error{background:#351313;border:1px solid #702020;padding:12px;border-radius:10px;color:#ffb3b3}.success{color:#7dff9b}.print-area{display:none}
@media(max-width:650px){.stats{grid-template-columns:1fr}.headin{align-items:flex-start}.top{flex-direction:column}}
@media print{body>*{display:none!important}.print-area{display:block!important;color:#000;background:#fff;padding:15mm;font-family:Arial}.print-card{border:2px solid #000;padding:12mm;page-break-inside:avoid}.print-card h1{margin:0 0 8px}.print-row{border-top:1px solid #999;padding:7px 0}.print-total{font-size:20px;font-weight:900}}
</style></head><body>
<header class="head"><div class="wrap headin"><div class="logo">Eletro<span>shopp</span> <small style="font-size:12px;color:#777">GESTÃO</small></div><div><button class="btn" onclick="location.href='/'">← Loja</button> <button class="btn" onclick="logout()">Sair</button></div></div></header>
<section id="login" class="login"><h1>🔐 Área do proprietário</h1><p class="note">Digite o PIN de administrador para acessar os pedidos.</p><input id="pin" class="input" type="password" placeholder="PIN" autocomplete="off"><button class="btn primary" style="width:100%" onclick="login()">Entrar no painel</button><div id="loginMsg" class="note" style="margin-top:12px"></div></section>
<main id="app" class="wrap hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h1 style="margin:10px 0 2px">📋 Pedidos recebidos</h1><div class="note">Gerencie, imprima e acompanhe os pedidos da Eletroshopp.</div></div><button class="btn primary" onclick="loadOrders()">↻ Atualizar</button></div><div class="stats"><div class="stat">Pedidos totais<b id="total">0</b></div><div class="stat">Novos<b id="new">0</b></div><div class="stat">Impressos<b id="printed">0</b></div></div><div id="msg"></div><section id="orders" class="orders"></section></main><div id="printArea" class="print-area"></div>
<script>
const API='https://sybxbyaywznbwipbssso.supabase.co/functions/v1/admin-orders';const PIN_KEY='eletro_admin_pin';let orders=[];
function pin(){return sessionStorage.getItem(PIN_KEY)||''}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function api(method='GET',body){const r=await fetch(API,{method,headers:{'content-type':'application/json','x-admin-pin':pin()},body:body?JSON.stringify(body):undefined});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error||'Falha de comunicação');return d}
async function login(){const p=document.getElementById('pin').value.trim();if(!p)return;sessionStorage.setItem(PIN_KEY,p);try{await api('GET');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadOrders()}catch(e){sessionStorage.removeItem(PIN_KEY);document.getElementById('loginMsg').textContent='PIN inválido ou painel indisponível.'}}
function logout(){sessionStorage.removeItem(PIN_KEY);location.reload()}
async function loadOrders(){try{orders=await api('GET');render()}catch(e){document.getElementById('msg').innerHTML='<div class="error">Não foi possível carregar os pedidos: '+e.message+'</div>'}}
function render(){const list=document.getElementById('orders');document.getElementById('total').textContent=orders.length;document.getElementById('new').textContent=orders.filter(o=>o.status==='novo').length;document.getElementById('printed').textContent=orders.filter(o=>o.status==='impresso').length;if(!orders.length){list.innerHTML='<div class="empty">📭 Nenhum pedido recebido ainda.</div>';return}list.innerHTML=orders.map(o=>{const b=o.buyer||{},its=o.items||[],when=new Date(o.created_at).toLocaleString('pt-BR');return `<article class="order ${o.status==='novo'?'new':''}"><div class="top"><div><div class="id">${o.id}</div><small>${when}</small></div><span class="status ${o.status==='impresso'?'printed':''}">${o.status==='novo'?'NOVO':'IMPRESSO'}</span></div><div class="meta"><b>Cliente:</b> ${esc(b.name)}${b.phone?' • '+esc(b.phone):''}<br><b>Destino:</b> ${esc(b.address||'—')}${b.number?', nº '+esc(b.number):''}${b.neighborhood?', '+esc(b.neighborhood):''} — ${esc(b.city||'—')} • CEP ${esc(b.cep||'—')}<br><b>Frete:</b> ${esc(o.freight?.id||'—')} — ${money(o.freight?.price)} • ${esc(o.freight?.days||'')}<br><b>Pagamento:</b> ${esc(o.payment||'—')}</div><div class="items">${its.map(i=>`${i.qty||1}× ${esc(i.name)} — ${esc(i.sale||money(i.price))}`).join('<br>')}</div><p><b>Total: ${money(o.grand_total)}</b></p><div class="actions"><button class="btn primary" onclick="printOrder('${o.id}')">🖨️ Imprimir pedido</button><button class="btn" onclick="markPrinted('${o.id}')">✓ Marcar impresso</button><button class="btn danger" onclick="removeOrder('${o.id}')">🗑️ Excluir</button></div></article>`}).join('')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function get(id){return orders.find(o=>o.id===id)}
async function markPrinted(id){await api('POST',{id,status:'impresso'});await loadOrders()}
async function removeOrder(id){if(!confirm('Excluir definitivamente este pedido?'))return;await api('DELETE',{id});await loadOrders()}
function printOrder(id){const o=get(id);if(!o)return;const b=o.buyer||{},items=o.items||[];document.getElementById('printArea').innerHTML=`<div class="print-card"><h1>Eletroshopp — Pedido ${esc(o.id)}</h1><div class="print-row"><b>Emitido:</b> ${new Date(o.created_at).toLocaleString('pt-BR')}</div><div class="print-row"><b>Cliente:</b> ${esc(b.name)} • ${esc(b.phone)}</div><div class="print-row"><b>Endereço:</b> ${esc(b.address)}, nº ${esc(b.number)} — ${esc(b.neighborhood)} — ${esc(b.city)} — CEP ${esc(b.cep)}</div><div class="print-row"><b>Frete:</b> ${esc(o.freight?.id)} — ${money(o.freight?.price)} — ${esc(o.freight?.days)} dias úteis</div><div class="print-row"><b>Pagamento:</b> ${esc(o.payment)}</div><div class="print-row"><b>Itens:</b><br>${items.map(i=>`${i.qty||1}× ${esc(i.name)} — ${esc(i.sale||'')}`).join('<br>')}</div><div class="print-row print-total">Total: ${money(o.grand_total)}</div><div class="print-row"><b>Observação:</b> ${esc(b.note||'—')}</div><div class="print-row">Remetente: Eletroshopp • CEP 84272-402 • WhatsApp (42) 99815-7736</div></div>`;window.print();markPrinted(id)}
if(pin()){document.getElementById('pin').value=pin();login()}
</script></body></html>
