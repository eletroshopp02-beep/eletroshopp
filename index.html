<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><meta name="description" content="Eletroshopp — tecnologia, ferramentas e acessórios."><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><title>Eletroshopp</title></head><body><header class="topbar"><a class="brand" href="./">Eletroshopp</a><button id="cartButton" class="cart" type="button">🛒 <span id="cartCount">0</span></button></header><main><section class="hero"><span class="eyebrow">ELETROSHOPP</span><h1>Seu próximo eletrônico está aqui.</h1><p>Catálogo organizado, preço visível e pedido simples.</p></section><section class="toolbar"><input id="search" type="search" placeholder="🔎 Buscar produto..." autocomplete="off"><select id="category"><option value="">Todas as categorias</option></select></section><div id="status" class="status"></div><section id="products" class="grid"></section></main><aside id="cartPanel" class="cart-panel" aria-hidden="true"><div class="cart-head"><h2>Carrinho</h2><button id="closeCart" type="button">×</button></div><div id="cartItems"></div><div class="cart-total"><span>Total</span><strong id="cartTotal">R$ 0,00</strong></div><button id="checkout" class="primary">Continuar pedido</button></aside><div id="backdrop" class="backdrop"></div><section id="checkoutModal" class="modal" aria-hidden="true"><div class="modal-card"><div class="modal-head"><h2>Finalizar pedido</h2><button id="closeCheckout" type="button">×</button></div><form id="checkoutForm"><label>Nome<input id="buyerName" required autocomplete="name"></label><label>WhatsApp<input id="buyerPhone" required inputmode="tel" autocomplete="tel" placeholder="(42) 99999-9999"></label><label>CEP<input id="buyerCep" required inputmode="numeric" maxlength="9" placeholder="00000-000"></label><div class="two"><label>Número<input id="buyerNumber" required inputmode="numeric"></label><label>Complemento<input id="buyerComplement"></label></div><label>Endereço<input id="buyerAddress" required></label><div class="two"><label>Bairro<input id="buyerNeighborhood" required></label><label>Cidade/UF<input id="buyerCity" required></label></div><button id="quoteFreight" class="secondary" type="button">🚚 Calcular frete real</button><div id="freightResults" class="freight-results"></div><label>Pagamento<select id="payment"><option>Pagamento na confirmação</option><option>Pix</option><option>Cartão</option></select></label><div id="checkoutSummary" class="summary"></div><button class="primary" type="submit">Confirmar pedido e abrir WhatsApp</button></form></div></section><script type="module" src="./app.js"></script></body></html>
